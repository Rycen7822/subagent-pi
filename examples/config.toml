# Copy to ~/.local/state/subagent-pi/config.toml, or $PI_AGENTS_HOME/config.toml.
# Restart the daemon after changing configuration. Never store secrets in a repository.
# pi_command = ["/absolute/path/to/pi"]
max_resident_agents = 4
max_agents_per_scope = 16
rpc_timeout_seconds = 20
startup_timeout_seconds = 30
default_run_timeout_seconds = 1800
max_wait_seconds = 3600
event_max_count_per_agent = 20000

[inheritance]
enabled = true
skills = true
mcp = true
# codex_home = "/home/you/.codex"  # optional explicit trusted source

[profiles.default]
# Pi's own configuration loads by default; set these to false to isolate the
# child from your global/project extensions and skills.
ambient_extensions = true
ambient_skills = true
extensions = []
skills = []
tools = ["read", "bash", "edit", "write", "grep", "find", "ls"]
# model = "provider/model-id"
# provider = "your-provider"
# thinking = "medium"

[profiles.reader]
ambient_extensions = true
ambient_skills = true
extensions = []
skills = []
# Allowed built-ins for this child. Applied (and read back) inside Pi by the
# shipped extensions/managed-surface.ts: extension/custom tools are untouched,
# and the launch fails if the surface report is missing or does not match.
tools = ["read", "grep", "find", "ls"]

# Optional explicitly selected provider extension. It runs trusted code.
# [profiles.custom-provider]
# ambient_extensions = true
# ambient_skills = true
# extensions = ["/home/you/.pi/agent/extensions/provider.ts"]
# skills = []
# tools = ["read", "bash", "edit", "write", "grep", "find", "ls"]
# model = "your-provider/your-model"
